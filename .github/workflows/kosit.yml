name: KoSIT validation

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

env:
    KOSIT_VALIDATOR_VERSION: 1.6.3
    KOSIT_BIS_VERSION: 3.0.21
    KOSIT_PORT: 8081

jobs:
    kosit:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Cache KoSIT validator and configuration
              uses: actions/cache@v4
              with:
                  path: .kosit
                  key: kosit-${{ env.KOSIT_VALIDATOR_VERSION }}-bis-${{ env.KOSIT_BIS_VERSION }}

            - name: Install dependencies
              run: npm ci

            - name: Start KoSIT validator
              run: |
                  bash scripts/kosit.sh download
                  nohup bash scripts/kosit.sh > kosit.log 2>&1 &
                  for i in $(seq 1 60); do
                    if curl -s -o /dev/null "http://localhost:$KOSIT_PORT/"; then
                      echo "KoSIT is up"
                      exit 0
                    fi
                    sleep 1
                  done
                  echo "KoSIT did not start within 60s"
                  cat kosit.log
                  exit 1

            - name: Run KoSIT end-to-end tests
              run: npm run test:e2e
              env:
                  KOSIT_ENDPOINT: http://localhost:${{ env.KOSIT_PORT }}/

            - name: Upload generated documents and reports
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: kosit-reports
                  path: |
                      e2e/output/
                      kosit.log
