name: Publish to npm

on:
    push:
        branches:
            - main

permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org/

            - name: Get current package version
              id: pkg
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Check if this version is already published
              id: check
              run: |
                  # Look for this exact version: a version published under another
                  # dist-tag than latest (publishConfig.tag, e.g. canary) is not
                  # returned by `npm view . version`.
                  NAME=$(node -p "require('./package.json').name")
                  VERSION="${{ steps.pkg.outputs.version }}"
                  if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
                    echo "changed=false" >> $GITHUB_OUTPUT
                  else
                    echo "changed=true" >> $GITHUB_OUTPUT
                  fi

            - name: Install npm 11
              if: steps.check.outputs.changed == 'true'
              run: npm install -g npm@11

            - name: Install dependencies
              if: steps.check.outputs.changed == 'true'
              run: npm ci

            - name: Build package
              if: steps.check.outputs.changed == 'true'
              run: npm run build

            - name: Publish to npm
              if: steps.check.outputs.changed == 'true'
              run: |
                  # Dist-tag from publishConfig.tag (latest when unset). Passed explicitly
                  # because npm logs "with tag latest" even when publishing under publishConfig.tag.
                  TAG=$(node -p "require('./package.json').publishConfig?.tag ?? 'latest'")
                  npm publish --tag "$TAG"
